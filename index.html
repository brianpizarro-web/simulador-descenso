<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador Descenso Primera Nacional</title>
    <style>
        body { font-family: system-ui, sans-serif; background-color: #121212; color: #ffffff; padding: 20px; max-width: 900px; margin: auto; }
        h1 { text-align: center; font-size: 1.5rem; margin-bottom: 30px; }
        
        .container { display: flex; flex-wrap: wrap; gap: 30px; position: relative; }
        .panel { flex: 1; min-width: 320px; background: #1e1e1e; padding: 20px; border-radius: 8px; }
        h3 { margin-top: 0; border-bottom: 1px solid #333; padding-bottom: 10px; color: #aaa; }
        
        .panel-tabla { position: sticky; top: 20px; align-self: flex-start; }

        /* Diseño de Acordeones */
        .fecha-grupo { margin-bottom: 10px; }
        .accordion-btn {
            background-color: #2a2a2a;
            color: white;
            cursor: pointer;
            padding: 12px 15px;
            width: 100%;
            border: none;
            text-align: left;
            outline: none;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background-color 0.2s;
        }
        .accordion-btn:hover { background-color: #333; }
        .accordion-content {
            padding: 5px 10px;
            display: none; 
            background-color: #161616;
            border-radius: 0 0 4px 4px;
            margin-bottom: 10px;
        }
        .accordion-content.active { display: block; }
        
        /* Ajuste UX para Localías */
        .match { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; padding: 12px 0; border-bottom: 1px solid #2a2a2a; }
        .match:last-child { border-bottom: none; }
        .match-info { font-size: 0.95rem; text-align: center; display: flex; justify-content: space-between; padding: 0 5px; }
        .team-local { font-weight: bold; text-align: left; flex: 1; }
        .team-visitante { font-weight: bold; text-align: right; flex: 1; }
        .vs { color: #666; font-size: 0.8rem; flex: 0.2; text-align: center; align-self: center; }
        
        .btn-group { display: flex; gap: 5px; width: 100%; }
        .btn { flex: 1; background: #333; color: #fff; border: none; padding: 10px 0; border-radius: 4px; cursor: pointer; font-weight: bold; transition: background 0.2s; font-size: 0.9rem; }
        .btn:hover { background: #444; }
        .btn.active { background: #007bff; color: white; }

        /* Tabla simplificada a 2 columnas */
        .tabla-header { display: grid; grid-template-columns: 3fr 1fr; padding: 10px; border-bottom: 1px solid #555; font-weight: bold; font-size: 0.9rem; color: #aaa; }
        .tabla-header div:last-child { text-align: right; }
        
        .tbody { position: relative; height: 350px; margin-top: 10px; }
        .fila { position: absolute; left: 0; width: 100%; height: 50px; display: grid; grid-template-columns: 3fr 1fr; align-items: center; padding: 0 10px; box-sizing: border-box; transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1), background 0.3s; border-bottom: 1px solid #2a2a2a; }
        .team-pts { text-align: right; font-size: 1.1rem; }
        .team-name { transition: color 0.3s; }
        
        /* Colores aplicados directamente al texto */
        .salvado { color: #4CAF50; font-weight: bold; }
        .desempate { color: #FFC107; font-weight: bold; }
        .descendido { color: #F44336; font-weight: bold; }
    </style>
</head>
<body>

    <h1>Simulador: Zona de Descenso</h1>
    
    <div class="container">
        <div class="panel" id="fixture-container">
            <h3>Fixture Restante</h3>
        </div>

        <div class="panel panel-tabla">
            <h3>Tabla de Posiciones</h3>
            <div class="tabla-header">
                <div>Equipo</div>
                <div>Pts</div>
            </div>
            <div class="tbody" id="tabla-body">
            </div>
        </div>
    </div>

    <script>
        const basePts = { "Almagro": 41, "Agropecuario": 40, "Quilmes": 39, "Nueva Chicago": 36, "Patronato": 34, "Chacarita": 33, "Güemes": 23 };
        
        const matches = [
            // Fecha 33
            { id: 1, l: "Güemes", v: "Patronato", f: "Fecha 33" },
            { id: 2, l: "Nueva Chicago", v: "Temperley", f: "Fecha 33" },
            // Fecha 34
            { id: 3, l: "Almagro", v: "Güemes", f: "Fecha 34" },
            { id: 4, l: "Chacarita", v: "Deportivo Maipú", f: "Fecha 34" },
            { id: 5, l: "Patronato", v: "Tristán Suárez", f: "Fecha 34" },
            { id: 6, l: "Nueva Chicago", v: "Gimnasia (J)", f: "Fecha 34" },
            { id: 7, l: "Quilmes", v: "Atlético Rafaela", f: "Fecha 34" },
            { id: 8, l: "Agropecuario", v: "Colegiales", f: "Fecha 34" },
            // Fecha 35
            { id: 9, l: "Deportivo Maipú", v: "Güemes", f: "Fecha 35" },
            { id: 10, l: "Temperley", v: "Chacarita", f: "Fecha 35" },
            { id: 11, l: "Patronato", v: "Agropecuario", f: "Fecha 35" },
            { id: 12, l: "San Martín (SJ)", v: "Nueva Chicago", f: "Fecha 35" },
            { id: 13, l: "San Martín (T)", v: "Quilmes", f: "Fecha 35" },
            { id: 14, l: "Tristán Suárez", v: "Almagro", f: "Fecha 35" },
            // Fecha 36
            { id: 15, l: "Güemes", v: "Temperley", f: "Fecha 36" },
            { id: 16, l: "Nueva Chicago", v: "Chacarita", f: "Fecha 36" },
            { id: 17, l: "Atlético Rafaela", v: "Patronato", f: "Fecha 36" },
            { id: 18, l: "Quilmes", v: "Gimnasia y Tiro", f: "Fecha 36" },
            { id: 19, l: "Almagro", v: "Agropecuario", f: "Fecha 36" }
        ];

        let results = {};

        function init() {
            const tbody = document.getElementById("tabla-body");
            Object.keys(basePts).forEach(team => {
                const fila = document.createElement("div");
                fila.className = "fila";
                fila.id = "row-" + team.replace(/\s+/g, '-');
                fila.innerHTML = `
                    <div class="team-name">${team}</div>
                    <div class="team-pts"><b>${basePts[team]}</b></div>
                `;
                tbody.appendChild(fila);
            });

            const container = document.getElementById("fixture-container");
            const fechas = [...new Set(matches.map(m => m.f))];
            
            fechas.forEach((fecha, index) => {
                const grupo = document.createElement("div");
                grupo.className = "fecha-grupo";
                
                const btn = document.createElement("button");
                btn.className = "accordion-btn";
                btn.innerHTML = `${fecha} <span>${index === 0 ? '▲' : '▼'}</span>`;
                
                const content = document.createElement("div");
                content.className = "accordion-content";
                if (index === 0) content.classList.add("active");
                
                btn.onclick = function() {
                    const isActive = content.classList.contains("active");
                    content.classList.toggle("active");
                    this.innerHTML = `${fecha} <span>${isActive ? '▼' : '▲'}</span>`;
                };

                matches.filter(m => m.f === fecha).forEach(m => {
                    results[m.id] = "pend";
                    const matchDiv = document.createElement("div");
                    matchDiv.className = "match";
                    matchDiv.dataset.id = m.id;
                    matchDiv.innerHTML = `
                        <div class="match-info">
                            <span class="team-local">${m.l}</span>
                            <span class="vs">vs</span>
                            <span class="team-visitante">${m.v}</span>
                        </div>
                        <div class="btn-group">
                            <button class="btn" data-val="L" onclick="update(${m.id}, 'L')">Local</button>
                            <button class="btn" data-val="E" onclick="update(${m.id}, 'E')">Empate</button>
                            <button class="btn" data-val="V" onclick="update(${m.id}, 'V')">Visita</button>
                        </div>
                    `;
                    content.appendChild(matchDiv);
                });
                
                grupo.appendChild(btn);
                grupo.appendChild(content);
                container.appendChild(grupo);
            });

            calculate();
        }

        function update(id, val) {
            results[id] = val;
            const matchRow = document.querySelector(`.match[data-id='${id}']`);
            matchRow.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
            matchRow.querySelector(`.btn[data-val='${val}']`).classList.add('active');
            calculate();
        }

        function calculate() {
            let currentPts = { ...basePts };

            matches.forEach(m => {
                const res = results[m.id];
                if (res === "L") {
                    if(currentPts[m.l] !== undefined) currentPts[m.l] += 3;
                } else if (res === "E") {
                    if(currentPts[m.l] !== undefined) currentPts[m.l] += 1;
                    if(currentPts[m.v] !== undefined) currentPts[m.v] += 1;
                } else if (res === "V") {
                    if(currentPts[m.v] !== undefined) currentPts[m.v] += 3;
                }
            });

            let table = Object.keys(currentPts).map(k => ({ name: k, pts: currentPts[k] }));
            table.sort((a, b) => b.pts - a.pts);

            table.forEach((team, index) => {
                let samePts = table.filter(t => t.pts === team.pts).length;
                let teamsBelow = table.filter(t => t.pts < team.pts).length;
                
                let peorPosicion = 7 - teamsBelow; 
                let mejorPosicion = 8 - (teamsBelow + samePts);
                
                if (mejorPosicion <= 5 && peorPosicion >= 6) {
                    team.class = "desempate";
                } else if (mejorPosicion >= 6) {
                    team.class = "descendido";
                } else {
                    team.class = "salvado";
                }

                const rowId = "row-" + team.name.replace(/\s+/g, '-');
                const rowElement = document.getElementById(rowId);
                
                rowElement.style.transform = `translateY(${index * 50}px)`;
                rowElement.querySelector('.team-pts b').innerText = team.pts;
                
                // Aplica el color directamente al nombre del equipo
                const nameDiv = rowElement.querySelector('.team-name');
                nameDiv.className = `team-name ${team.class}`;
            });
        }

        init();
    </script>
</body>
</html>
